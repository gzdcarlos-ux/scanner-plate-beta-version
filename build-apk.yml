name: Build Android APK

# Compila o app automaticamente sempre que você enviar (push) código para o
# repositório, ou quando disparado manualmente pela aba "Actions" do GitHub.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Java (necessário para o Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Baixar dependências do projeto
        run: flutter pub get

      - name: Compilar o APK de release
        run: flutter build apk --release

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
