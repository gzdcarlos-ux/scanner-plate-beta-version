workflows:
  android-release:
    name: Android — Leitor de Placas (Release APK)
    max_build_duration: 60

    # mac_mini_m2 funciona tanto no plano gratuito quanto pago do Codemagic.
    # Se você tiver billing habilitado, pode trocar para "linux_x2": builds
    # Android-only ficam mais rápidos e baratos numa máquina Linux.
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true

    scripts:
      - name: Diagnóstico — verificar estrutura do repositório
        script: |
          echo "Diretório atual (raiz do checkout): $(pwd)"
          echo "--- Conteúdo da raiz ---"
          ls -la
          echo "--- pubspec.yaml existe na raiz? ---"
          test -f pubspec.yaml && echo "OK: pubspec.yaml encontrado" || echo "PROBLEMA: pubspec.yaml NÃO está na raiz do repositório"
          echo "--- pasta android/ existe? ---"
          find . -maxdepth 4 -iname "AndroidManifest.xml" 2>/dev/null || echo "Nenhum AndroidManifest.xml encontrado em lugar nenhum do repositório"

      - name: Preservar configuração customizada do Android (se existir)
        script: |
          mkdir -p /tmp/android_custom
          if [ -f "android/app/src/main/AndroidManifest.xml" ] && [ -f "android/app/build.gradle" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/android_custom/AndroidManifest.xml
            cp android/app/build.gradle /tmp/android_custom/build.gradle
            echo "OK: configuração customizada encontrada e salva em /tmp/android_custom."
          else
            echo "AVISO: android/app/src/main/AndroidManifest.xml e/ou android/app/build.gradle não encontrados."
            echo "O build vai seguir usando os arquivos PADRÃO gerados pelo 'flutter create' (sem as permissões de câmera/internet nem o minSdkVersion 21 customizados)."
            echo "Isso normalmente significa que a pasta 'android/' não chegou completa no repositório GitHub — veja o passo de Diagnóstico acima."
          fi

      - name: Gerar arquivos base do Android (gradle wrapper, ícones, MainActivity)
        script: |
          flutter create --platforms=android --org com.example --project-name plate_scanner_app .

      - name: Restaurar configuração customizada (se foi salva)
        script: |
          if [ -f "/tmp/android_custom/AndroidManifest.xml" ] && [ -f "/tmp/android_custom/build.gradle" ]; then
            cp /tmp/android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            cp /tmp/android_custom/build.gradle android/app/build.gradle
            echo "OK: configuração customizada restaurada."
          else
            echo "Seguindo com os arquivos padrão do flutter create (nenhuma customização para restaurar)."
          fi

      - name: Instalar dependências Flutter
        script: flutter pub get

      - name: Analisar código (não falha o build, só reporta)
        script: flutter analyze || true

      - name: Build do APK (release)
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/**/*.apk

    # Descomente e preencha para receber um e-mail com o link de download
    # assim que cada build terminar:
    #
    # publishing:
    #   email:
    #     recipients:
    #       - seu-email@exemplo.com
    #     notify:
    #       success: true
    #       failure: true

  android-debug:
    name: Android — Leitor de Placas (Debug APK, build manual/rápido)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    # Sem "triggering" -> este workflow só roda quando disparado manualmente
    # pela interface do Codemagic (útil para testar sem esperar o push).
    scripts:
      - name: Diagnóstico — verificar estrutura do repositório
        script: |
          echo "Diretório atual (raiz do checkout): $(pwd)"
          ls -la
          test -f pubspec.yaml && echo "OK: pubspec.yaml encontrado" || echo "PROBLEMA: pubspec.yaml NÃO está na raiz do repositório"

      - name: Preservar configuração customizada do Android (se existir)
        script: |
          mkdir -p /tmp/android_custom
          if [ -f "android/app/src/main/AndroidManifest.xml" ] && [ -f "android/app/build.gradle" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/android_custom/AndroidManifest.xml
            cp android/app/build.gradle /tmp/android_custom/build.gradle
            echo "OK: configuração customizada encontrada e salva."
          else
            echo "AVISO: AndroidManifest.xml/build.gradle customizados não encontrados — seguindo com os padrões do flutter create."
          fi

      - name: Gerar arquivos base do Android
        script: |
          flutter create --platforms=android --org com.example --project-name plate_scanner_app .

      - name: Restaurar configuração customizada (se foi salva)
        script: |
          if [ -f "/tmp/android_custom/AndroidManifest.xml" ] && [ -f "/tmp/android_custom/build.gradle" ]; then
            cp /tmp/android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            cp /tmp/android_custom/build.gradle android/app/build.gradle
            echo "OK: configuração customizada restaurada."
          else
            echo "Nenhuma customização para restaurar."
          fi

      - name: Instalar dependências Flutter
        script: flutter pub get

      - name: Build do APK (debug)
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/**/*.apk
